<!DOCTYPE html>
<html>
<head>
    <title>iMaxx App</title>

    <script>
        window.onload = function () {

            var ua = navigator.userAgent || navigator.vendor || window.opera;

            if (/android/i.test(ua)) {

                window.location.href =
                "https://play.google.com/store/apps/details?id=com.mahindra.bluesensepluscv";

            } else if (/iPhone|iPad|iPod/i.test(ua)) {

                window.location.href =
                "https://apps.apple.com/in/app/imaxx-for-scvs/id1617274237";

            } else {

                document.body.innerHTML =
                '<h2>Download iMaxx App</h2>' +
                '<a href="https://play.google.com/store/apps/details?id=com.mahindra.bluesensepluscv">Android App</a><br><br>' +
                '<a href="https://apps.apple.com/in/app/imaxx-for-scvs/id1617274237">iPhone App</a>';

            }
        };
    </script>

</head>

<body>
</body>
</html>
